# Random building generator configuration
# Use with --random flag to enable randomization
# Example: python genbricks.py --config config_random.yaml --random

# Base dimensions with randomization ranges
width:
  value: 20
  random:
    enabled: true
    range: [16, 28]

length:
  value: 18
  random:
    enabled: true
    range: [14, 24]

height:
  value: 10
  random:
    enabled: true
    range: [8, 14]

# Window configuration
window_size: [2, 2]
window_spacing: 4

# Door configuration
door_size: [2, 3]
number_of_doors:
  value: 2
  random:
    enabled: true
    range: [1, 3]

# Colors (try different ones!)
wall_color: "tan"
roof_color: "dark_red"
roof_type: "pitched"

# Output
output_file: "random_building.ldr"
